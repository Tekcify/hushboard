name: Bug report
description: Something doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a security issue (for example about the macOS helper), please don't file it here: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: I pressed Lock keyboard, the island showed "Keyboard locked", but typing still worked in Safari.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and machine
      placeholder: macOS 26.1 on a MacBook Pro M2 / Windows 11 24H2 / Fedora 41 GNOME
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: Lock method (macOS)
      description: The Keyboard helper card in the panel shows which one is in use.
      options:
        - Keyboard helper (Ready)
        - Without the helper
        - Not macOS
  - type: input
    id: keyboards
    attributes:
      label: Keyboards
      placeholder: Built-in, plus a Keychron K2 over Bluetooth
  - type: input
    id: version
    attributes:
      label: Hushboard version or commit
      placeholder: 0.1.0 or a commit hash
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: |
        The terminal output from `npm run tauri dev`, and on macOS the helper's log (`/var/log/app.hushboard.keyhelper.log`). Screenshots of the panel help too.
      render: text
