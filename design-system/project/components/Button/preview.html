    <button class="hb-btn hb-btn--primary" type="button" disabled>Lock keyboard</button>
  </div>
  <div class="hb-row">
    <button class="hb-btn hb-btn--primary hb-btn--lg" type="button">Start cleaning</button>
  </div>
</div>

</html>
