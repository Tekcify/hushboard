<!-- @dsCard group="Inputs" height=230 subtitle="Pick which keyboards to lock" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DeviceRow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&display=swap">
</head>
<body>
<div class="hb-pad" style="max-width:480px">
  <div class="hb-devices" role="group" aria-label="Keyboards to lock" id="devs">
    <button class="hb-device" type="button" role="checkbox" aria-checked="true">
      <span class="hb-device__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.5 16.5v-8c0-2.357 0-3.536-.732-4.268C19.035 3.5 17.857 3.5 15.5 3.5h-7c-2.357 0-3.536 0-4.268.732S3.5 6.143 3.5 8.5v8m18.484 4H2.016c-.383 0-.632-.391-.461-.724L3.5 16.5h17l1.945 3.276a.5.5 0 0 1-.46.724"/></svg></span>
      <span><span class="hb-device__name">Built-in keyboard</span><br><span class="hb-device__meta">Will be locked</span></span>
      <span class="hb-switch" aria-hidden="true" aria-checked="true"></span>
    </button>
    <button class="hb-device" type="button" role="checkbox" aria-checked="false">
      <span class="hb-device__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m12.474 12l3.769-2.945c1.076-.84 1.614-1.26 1.729-1.806a1.5 1.5 0 0 0 .003-.618c-.11-.547-.643-.973-1.71-1.825c-1.61-1.284-2.415-1.927-3.091-1.787a1.5 1.5 0 0 0-.67.33c-.526.455-.526 1.494-.526 3.573v4.69m.496.388l-.496.388m.496-.388l3.769 2.945c1.076.84 1.614 1.26 1.729 1.806c.042.204.043.414.003.618c-.11.547-.643.973-1.71 1.825c-1.61 1.284-2.415 1.927-3.091 1.787a1.5 1.5 0 0 1-.67-.33c-.526-.455-.526-1.494-.526-3.573v-4.69m.496-.388l-.496-.388m0 .776l-5.973 4.667m5.973-4.667v-.776m0 0L6.005 6.945M5.38 12h-.125m13.625 0h-.125m-13.250 0a.25.25 0 1 1-.5 0a.25.25 0 0 1 .5 0m13.5 0a.25.25 0 1 1-.5 0a.25.25 0 0 1 .5 0"/></svg></span>
      <span><span class="hb-device__name">Keychron K2</span><br><span class="hb-device__meta">Bluetooth · stays active</span></span>
      <span class="hb-switch" aria-hidden="true" aria-checked="false"></span>
    </button>
    <button class="hb-device" type="button" role="checkbox" aria-checked="false">
      <span class="hb-device__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15.5 6v-.5c0-1.404 0-2.107-.337-2.611a2 2 0 0 0-.552-.552C14.107 2 13.404 2 12 2s-2.107 0-2.611.337a2 2 0 0 0-.552.552C8.5 3.393 8.5 4.096 8.5 5.5V6"/><path d="M6.004 7.113C5.937 6.243 6.64 5.5 7.53 5.5h8.94c.89 0 1.593.743 1.526 1.613l-.184 2.379a9.9 9.9 0 0 1-1.68 4.785l-.6.885a3.08 3.08 0 0 1-2.548 1.338h-1.968a3.08 3.08 0 0 1-2.547-1.338l-.601-.885a9.9 9.9 0 0 1-1.68-4.785z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 17v5M11 8.5h2"/></g></svg></span>
      <span><span class="hb-device__name">USB Keyboard</span><br><span class="hb-device__meta">USB · stays active</span></span>
      <span class="hb-switch" aria-hidden="true" aria-checked="false"></span>
    </button>
  </div>
</div>
<script>
document.getElementById('devs').addEventListener('click', function (e) {
  var row = e.target.closest('.hb-device'); if (!row) return;
  var on = row.getAttribute('aria-checked') !== 'true';
  row.setAttribute('aria-checked', on); row.querySelector('.hb-switch').setAttribute('aria-checked', on);
  var meta = row.querySelector('.hb-device__meta'), kind = meta.textContent.split(' · ')[0];
  meta.textContent = row.querySelector('.hb-device__name').textContent === 'Built-in keyboard' ? (on ? 'Will be locked' : 'Stays active') : kind + ' · ' + (on ? 'will be locked' : 'stays active');
});
</script>
</body>
</html>
