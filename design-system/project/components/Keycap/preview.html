<!-- @dsCard group="Feedback" height=170 subtitle="Rest · pressed · swallowed while locked. Click a key." -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Keycap</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500;600&display=swap">
</head>
<body>
<div class="hb-pad hb-stack">
  <div class="hb-keys" id="keys">
    <span class="hb-key hb-key--wide">Esc</span>
    <span class="hb-key">Q</span>
    <span class="hb-key hb-key--down">W</span>
    <span class="hb-key hb-key--swallowed">E</span>
    <span class="hb-key">R</span>
    <span class="hb-key hb-key--swallowed">T</span>
    <span class="hb-key hb-key--wide">⌫</span>
  </div>
  <div class="hb-keys">
    <span class="hb-key hb-key--wide">Shift</span>
    <span class="hb-key hb-key--space hb-key--swallowed">space</span>
    <span class="hb-key hb-key--wide">⏎</span>
  </div>
  <div class="hb-row" style="font-size:13px;color:var(--ink-muted)">
    <span>Escape shortcut:</span>
    <span class="hb-kbd"><kbd>Ctrl</kbd><kbd>Alt</kbd><kbd>U</kbd></span>
  </div>
</div>
<script>
document.getElementById('keys').addEventListener('pointerdown', function (e) {
  var k = e.target.closest('.hb-key'); if (!k) return;
  k.classList.add('hb-key--swallowed');
  setTimeout(function () { k.classList.remove('hb-key--swallowed'); }, 600);
});
</script>
</body>
</html>
