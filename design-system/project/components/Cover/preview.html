<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
  html, body { margin: 0; height: 288px; background: var(--surface); overflow: hidden; }
  .cv { position: relative; width: 960px; height: 288px; }
  .cv svg { position: absolute; inset: 0; }
  .seal { fill: var(--seal); }
  .ink { fill: var(--ink); }
  .suds { fill: var(--suds); }
  .caution { fill: var(--caution); }
  .key { fill: var(--key-face); stroke: var(--key-edge); stroke-width: 1; }
  .gone { fill: var(--suds); stroke: var(--seal); stroke-width: 1; }
  .k { rx: var(--radius-key); }
  .b { rx: var(--radius-lg); }
  .text { position: absolute; left: 48px; bottom: 40px; width: 440px; display: flex; flex-direction: column; gap: 12px; }
  .name { font: 750 80px/0.92 var(--font-display); letter-spacing: -0.03em; color: var(--ink); margin: 0; }
  .tag { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); margin: 0; }
</style>
</head>
<body>
<div class="cv">
  <!--
    blocks: seal 232x136 (radius-lg), ink 136x88, suds 136x88, caution 40x40 (radius-key)
    arrangement: a keyboard-like modular grid right of x=480; big blocks are merged keys, one spacebar
    pattern: "geometric, modular, dense UI → tiles cut by the radius tokens, some merged two-wide" — the product is literally a grid of keycaps; three tiles in suds/seal are the keys being swallowed
    steps/radii: tile 40 + gap space-2 (8) = pitch 48 (space-12); radius-key, radius-lg
  -->
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!-- row 0 -->
    <rect class="key k" x="496" y="24" width="40" height="40"/>
    <rect class="key k" x="544" y="24" width="40" height="40"/>
    <rect class="gone k" x="592" y="24" width="40" height="40"/>
    <rect class="key k" x="640" y="24" width="40" height="40"/>
    <!-- row 1 -->
    <rect class="key k" x="496" y="72" width="40" height="40"/>
    <rect class="gone k" x="544" y="72" width="40" height="40"/>
    <rect class="key k" x="592" y="72" width="40" height="40"/>
    <rect class="key k" x="640" y="72" width="40" height="40"/>
    <!-- row 2 -->
    <rect class="key k" x="496" y="120" width="40" height="40"/>
    <rect class="key k" x="544" y="120" width="40" height="40"/>
    <rect class="key k" x="592" y="120" width="40" height="40"/>
    <rect class="gone k" x="640" y="120" width="40" height="40"/>
    <!-- seal slab: cols 4-8, rows 0-2 -->
    <rect class="seal b" x="688" y="24" width="232" height="136"/>
    <!-- rows 3-4 -->
    <rect class="ink b" x="496" y="168" width="136" height="88"/>
    <rect class="suds b" x="640" y="168" width="136" height="88"/>
    <rect class="key k" x="784" y="168" width="136" height="40"/>
    <rect class="key k" x="784" y="216" width="40" height="40"/>
    <rect class="key k" x="832" y="216" width="40" height="40"/>
    <rect class="caution k" x="880" y="216" width="40" height="40"/>
  </svg>
  <div class="text">
    <p class="name">Hushboard</p>
    <p class="tag">Lock the keyboard, wipe it clean, get back to work.</p>
  </div>
</div>
</body>
</html>
